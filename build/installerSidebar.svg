<?xml version="1.0" encoding="UTF-8"?>
<svg width="164" height="314" viewBox="0 0 164 314" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="sidebarGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0071E3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004C9F;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle pattern overlay -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="white" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="164" height="314" fill="url(#sidebarGradient)"/>
  <rect width="164" height="314" fill="url(#dots)"/>

  <!-- Icon container (centered at top) -->
  <g transform="translate(32, 40)">
    <!-- TV/Monitor with rounded corners -->
    <rect x="0" y="0" width="100" height="70" rx="6" fill="white" opacity="0.95"/>

    <!-- Screen with gradient -->
    <defs>
      <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.8" />
        <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.9" />
      </linearGradient>
    </defs>
    <rect x="8" y="8" width="84" height="48" rx="3" fill="url(#screenGlow)"/>

    <!-- Broadcast waves -->
    <g transform="translate(50, 30)" opacity="0.9">
      <path d="M -15 0 Q -15 -8 -20 -12" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M -10 0 Q -10 -5 -13 -8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 15 0 Q 15 -8 20 -12" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 10 0 Q 10 -5 13 -8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Stand base -->
    <rect x="40" y="70" width="20" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="35" y="74" width="30" height="3" rx="1" fill="white" opacity="0.9"/>

    <!-- Chromecast badge -->
    <circle cx="85" cy="15" r="12" fill="#FF6B35" opacity="0.95"/>
    <text x="85" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
          fill="white" text-anchor="middle">C</text>
  </g>

  <!-- Product name -->
  <text x="82" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold"
        fill="white" text-anchor="middle" opacity="0.95">NARROWCAST</text>
  <text x="82" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="300"
        fill="white" text-anchor="middle" opacity="0.9">PRO</text>

  <!-- Tagline -->
  <text x="82" y="195" font-family="Arial, sans-serif" font-size="9"
        fill="white" text-anchor="middle" opacity="0.7">Multi-Chromecast</text>
  <text x="82" y="206" font-family="Arial, sans-serif" font-size="9"
        fill="white" text-anchor="middle" opacity="0.7">Digital Signage</text>

  <!-- Decorative elements -->
  <g opacity="0.15">
    <circle cx="20" cy="240" r="30" fill="white"/>
    <circle cx="144" cy="280" r="20" fill="white"/>
    <circle cx="30" cy="290" r="15" fill="white"/>
  </g>

  <!-- Version indicator at bottom -->
  <text x="82" y="300" font-family="Arial, sans-serif" font-size="8"
        fill="white" text-anchor="middle" opacity="0.5">v2.1</text>
</svg>
