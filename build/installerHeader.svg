<?xml version="1.0" encoding="UTF-8"?>
<svg width="150" height="57" viewBox="0 0 150 57" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0071E3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052B3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="150" height="57" fill="url(#headerGradient)"/>

  <!-- Icon (small version) -->
  <g transform="translate(10, 12)">
    <!-- TV/Monitor -->
    <rect x="0" y="0" width="32" height="22" rx="2" fill="white" opacity="0.95"/>

    <!-- Screen -->
    <defs>
      <linearGradient id="smallScreen" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.8" />
        <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.9" />
      </linearGradient>
    </defs>
    <rect x="3" y="3" width="26" height="14" rx="1" fill="url(#smallScreen)"/>

    <!-- Broadcast waves (simplified) -->
    <g transform="translate(16, 10)" opacity="0.9">
      <path d="M -5 0 Q -5 -3 -7 -4" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
      <path d="M 5 0 Q 5 -3 7 -4" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Stand -->
    <rect x="13" y="22" width="6" height="1.5" rx="0.5" fill="white" opacity="0.9"/>
    <rect x="11" y="23.5" width="10" height="1" rx="0.5" fill="white" opacity="0.9"/>

    <!-- Chromecast badge -->
    <circle cx="28" cy="5" r="4" fill="#FF6B35" opacity="0.95"/>
    <text x="28" y="7.5" font-family="Arial, sans-serif" font-size="5" font-weight="bold"
          fill="white" text-anchor="middle">C</text>
  </g>

  <!-- Product name -->
  <text x="50" y="23" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
        fill="white" opacity="0.95">NARROWCAST PRO</text>
  <text x="50" y="35" font-family="Arial, sans-serif" font-size="7"
        fill="white" opacity="0.7">Multi-Chromecast Digital Signage</text>

  <!-- Decorative dots -->
  <g opacity="0.15">
    <circle cx="135" cy="15" r="8" fill="white"/>
    <circle cx="140" cy="40" r="6" fill="white"/>
  </g>
</svg>
