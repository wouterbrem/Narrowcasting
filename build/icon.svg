<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#0071E3"/>

  <!-- Main TV/Monitor Icon -->
  <rect x="96" y="128" width="320" height="224" rx="12" fill="white" opacity="0.95"/>
  <rect x="112" y="144" width="288" height="176" rx="4" fill="#1C1C1E"/>

  <!-- Broadcast waves (representing narrowcasting) -->
  <g opacity="0.9">
    <!-- Wave 1 -->
    <path d="M 256 200 Q 220 200 200 230" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 256 200 Q 292 200 312 230" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Wave 2 -->
    <path d="M 256 210 Q 235 210 225 230" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 256 210 Q 277 210 287 230" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Center dot -->
    <circle cx="256" cy="200" r="10" fill="white"/>
  </g>

  <!-- Stand -->
  <rect x="236" y="352" width="40" height="32" rx="4" fill="white" opacity="0.95"/>
  <rect x="196" y="384" width="120" height="8" rx="4" fill="white" opacity="0.95"/>

  <!-- Chromecast/Cast icon in corner -->
  <g transform="translate(360, 280)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="#34C759" opacity="0.9"/>
    <path d="M 8 16 Q 8 8 16 8" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 8 20 Q 8 14 14 14" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="8" cy="24" r="2" fill="white"/>
  </g>

  <!-- Title at bottom -->
  <text x="256" y="450" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.95">
    NARROWCAST
  </text>
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="28" font-weight="normal" fill="white" text-anchor="middle" opacity="0.8">
    PRO
  </text>
</svg>
